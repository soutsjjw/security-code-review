- id: DP-04
  title: 軟體版本更新
  category: DP
  control_objective: 確保運行元件受安全維護
  rule_version: 2.0.0
  control_type: hybrid
  origin:
    legacy_id: DP-04
    legacy_title: 軟體版本更新
    legacy_levels: 普/中/高
    legal_equivalence_verified: false
  applicability:
    must_assess_when: 使用可辨識版本與支援生命週期的元件、Runtime 或平台
    may_be_not_applicable_when: 無適用版本組件，須有依賴清單佐證
    decision_criteria:

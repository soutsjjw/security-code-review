- id: CR-05
  title: HTTP 安全標頭設定
  category: CR
  control_objective: 減少瀏覽器與中介層安全風險
  rule_version: 2.0.0-rc1
  control_type: hybrid
  origin:
    legacy_id: CR-05
    legacy_title: HTTP 安全標頭設定
    legacy_levels: 普/中/高
    legal_equivalence_verified: false
  applicability:
    must_assess_when: 系統提供 HTTP 回應或瀏覽器可存取資源
    may_be_not_applicable_when: 不提供任何 HTTP/Web 服務
    decision_criteria:
    - 功能是否存在
    - 系統處理資料分類
    - 控制實際責任人
    - 適用且已生效要求/合約政策
    level_selection: 由專案 Profile + 核准矩陣決定；不可由框架或 AI 自動推定
    no_evidence: review
  inspection:
    search_targets:
    - HSTS/CSP/CORS 等標頭
    - 正式環境 HTTP 回應實證
    review_instructions:
    - 檢查相關程式碼、設定與呼叫鏈，確認是否有外部或平台控制責任。
    - 記錄觸發條件、正常行為與繞過/失效情境。
    - 將檢查結果與當前 Commit 及證據來源綁定，避免沿用前次專案結論。
    legacy_inspection_hints:
    - 檢查 CSP
    - HSTS
    - X-Content-Type-Options
    - frame 保護等
    verification_method: source_plus_deployment_evidence
  assessment:
    pass: 部署情境所需標頭完整且值安全
    fail: 要求的標頭缺失或策略過度寬鬆

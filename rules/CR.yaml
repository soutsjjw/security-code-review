category: CR
ruleset_version: 2.0.0-rc1
rules:
- id: CR-01
  title: 機敏資料傳輸加密
  category: CR
  control_objective: 保護機敏資料在傳輸途中的機密性
  rule_version: 2.0.0-rc1
  control_type: hybrid
  origin:
    legacy_id: CR-01
    legacy_title: 機敏資料傳輸加密
    legacy_levels: 中/高
    legal_equivalence_verified: false
  applicability:
    must_assess_when: 機敏資料跨程序、主機、網路或服務傳輸
    may_be_not_applicable_when: 不涉及機敏資料傳輸，應說明資料分類
    decision_criteria:
    - 功能是否存在
    - 系統處理資料分類
    - 控制實際責任人
    - 適用且已生效要求/合約政策
    level_selection: 由專案 Profile + 核准矩陣決定；不可由框架或 AI 自動推定
    no_evidence: review
  inspection:
    search_targets:
    - 外部 TLS 與反向 Proxy
    - 資料庫/內部 API/SMTP 加密
    review_instructions:
    - 檢查相關程式碼、設定與呼叫鏈，確認是否有外部或平台控制責任。
    - 記錄觸發條件、正常行為與繞過/失效情境。
    - 將檢查結果與當前 Commit 及證據來源綁定，避免沿用前次專案結論。
    legacy_inspection_hints:
    - 盤點 TLS
    - HTTP
    - SMTP
    - DB
    - 反向代理及憑證驗證
    verification_method: source_plus_deployment_evidence
  assessment:
    pass: 所有適用機敏傳輸採足夠保護
    fail: 機敏資料經明文鏈路或不驗證伺服器憑證
    review: 缺少必要的程式碼、部署、測試或制度證據；不以關鍵字未命中推定符合。
    not_applicable: 確認本系統沒有相關功能或控制義務，且具體記載不適用原因；若由其他層實作則應追查其證據。
    compliance_priority:
    - 適用且已施行的法律/強制規範
    - 有效合約或受核准政策
    - 本公司核准的安全基線
    - 非強制參考標準
  evidence_requirements:
    what_to_collect: 傳輸設定、網路拓樸、連線設定
    minimum:
    - 實際來源（檔案/組態/測試/制度或部署佐證）
    - 證據與判定的因果說明
    - 檢查日期及版本/環境識別
    source_locator:
    - repository_relative_path
    - line_start
    - line_end
    - git_revision
    external_locator:
    - artifact_id
    - owner
    - evidence_date
    redaction: 不得將個資、完整 Token、API Key、密碼寫入報告
  manual_review: 實際 TLS 組態與內部服務鏈路
  remediation_guidance: 啟用適當 TLS 與憑證驗證
  risk:
    default_severity: not_preassigned
    factors:
    - 受影響資料敏感度
    - 攻擊可行性與可利用路徑
    - 暴露面
    - 受影響使用者/系統範圍
    - 既有補償控制
    severity_required_for: validated_findings_only
  normative_notes: CORS 設定不能單獨證明 TLS 傳輸失效；需確認來源實際使用與伺服器 TLS。
  references:
    technical_requirements:
    - standard_id: OWASP-ASVS
      version: 5.0.0
      requirement_id: v5.0.0-12.2.1
      mapping_status: verified_to_official_requirement
      mapping_type: relevant_requirement_not_full_equivalence
      source: https://raw.githubusercontent.com/OWASP/ASVS/v5.0.0/5.0/docs_en/OWASP_Application_Security_Verification_Standard_5.0.0_en.json
    - standard_id: OWASP-ASVS
      version: 5.0.0
      requirement_id: v5.0.0-12.3.1
      mapping_status: verified_to_official_requirement
      mapping_type: relevant_requirement_not_full_equivalence
      source: https://raw.githubusercontent.com/OWASP/ASVS/v5.0.0/5.0/docs_en/OWASP_Application_Security_Verification_Standard_5.0.0_en.json
    risk_taxonomy:
    - standard_id: OWASP-TOP10
      version: '2025'
      category_id: A04:2025
      mapping_type: suggested_risk_classification_not_a_compliance_clause
    taiwan_web_guideline:
      standard_id: NICS-WEB-GUIDE
      version: '3.2'
      mapping_status: document_version_verified_clause_mapping_pending
    taiwan_legal_mapping:
      status: not_determined_per_project
      note: 不得將參考指引視為自動對所有機關/公司具法定強制力；須依適用對象核定。
  governance:
    control_owner: project_owner_or_delegated_provider
    approval_status: pending_security_signoff
    exception_policy: 不得由 AI 自行豁免；需填寫核准、期限、風險與補償控制
- id: CR-02
  title: 安全加密演算法
  category: CR
  control_objective: 避免不安全或錯誤使用密碼學
  rule_version: 2.0.0-rc1
  control_type: technical
  origin:
    legacy_id: CR-02
    legacy_title: 安全加密演算法
    legacy_levels: 高
    legal_equivalence_verified: false
  applicability:
    must_assess_when: 系統使用密碼學、簽章、JWT 或安全雜湊等功能
    may_be_not_applicable_when: 完全不自行使用／設定相關機制，委外部分須有責任界線
    decision_criteria:
    - 功能是否存在
    - 系統處理資料分類
    - 控制實際責任人
    - 適用且已生效要求/合約政策
    level_selection: 由專案 Profile + 核准矩陣決定；不可由框架或 AI 自動推定
    no_evidence: review
  inspection:
    search_targets:
    - 加密演算法與操作模式
    - 金鑰長度、IV/nonce、隨機數
    review_instructions:
    - 檢查相關程式碼、設定與呼叫鏈，確認是否有外部或平台控制責任。
    - 記錄觸發條件、正常行為與繞過/失效情境。
    - 將檢查結果與當前 Commit 及證據來源綁定，避免沿用前次專案結論。
    legacy_inspection_hints:
    - 搜尋 MD5
    - SHA1
    - DES
    - RSA
    - AES
    - JWT 簽章與隨機數
    verification_method: source_and_test
  assessment:
    pass: 適用用途採受認可演算法且金鑰管理正確
    fail: 弱演算法用於安全目的或金鑰不足
    review: 缺少必要的程式碼、部署、測試或制度證據；不以關鍵字未命中推定符合。
    not_applicable: 確認本系統沒有相關功能或控制義務，且具體記載不適用原因；若由其他層實作則應追查其證據。
    compliance_priority:
    - 適用且已施行的法律/強制規範
    - 有效合約或受核准政策
    - 本公司核准的安全基線
    - 非強制參考標準
  evidence_requirements:
    what_to_collect: 密碼 API、金鑰長度、使用情境
    minimum:
    - 實際來源（檔案/組態/測試/制度或部署佐證）
    - 證據與判定的因果說明
    - 檢查日期及版本/環境識別
    source_locator:
    - repository_relative_path
    - line_start
    - line_end
    - git_revision
    external_locator:
    - artifact_id
    - owner
    - evidence_date
    redaction: 不得將個資、完整 Token、API Key、密碼寫入報告
  manual_review: 雜湊作非安全校驗與安全用途須區分
  remediation_guidance: 替換弱演算法並強化金鑰管理
  risk:
    default_severity: not_preassigned
    factors:
    - 受影響資料敏感度
    - 攻擊可行性與可利用路徑
    - 暴露面
    - 受影響使用者/系統範圍
    - 既有補償控制
    severity_required_for: validated_findings_only
  normative_notes: 檢核要求須以核定適用矩陣、風險情境和控制責任判定；不得單以工具警示定性。
  references:
    technical_requirements:
    - standard_id: OWASP-ASVS
      version: 5.0.0
      requirement_id: v5.0.0-11.3.2
      mapping_status: verified_to_official_requirement
      mapping_type: relevant_requirement_not_full_equivalence
      source: https://raw.githubusercontent.com/OWASP/ASVS/v5.0.0/5.0/docs_en/OWASP_Application_Security_Verification_Standard_5.0.0_en.json
    risk_taxonomy:
    - standard_id: OWASP-TOP10
      version: '2025'
      category_id: A04:2025
      mapping_type: suggested_risk_classification_not_a_compliance_clause
    taiwan_web_guideline:
      standard_id: NICS-WEB-GUIDE
      version: '3.2'
      mapping_status: document_version_verified_clause_mapping_pending
    taiwan_legal_mapping:
      status: not_determined_per_project
      note: 不得將參考指引視為自動對所有機關/公司具法定強制力；須依適用對象核定。
  governance:
    control_owner: project_owner_or_delegated_provider
    approval_status: pending_security_signoff

- id: CR-04
  title: 機敏資料儲存加密
  category: CR
  control_objective: 保護儲存中的機敏資訊
  rule_version: 2.0.0-rc1
  control_type: hybrid
  origin:
    legacy_id: CR-04
    legacy_title: 機敏資料儲存加密
    legacy_levels: 高
    legal_equivalence_verified: false
  applicability:
    must_assess_when: 系統持久化機敏資料或個資
    may_be_not_applicable_when: 無受保護資料持久化及備份
    decision_criteria:
    - 功能是否存在
    - 系統處理資料分類
    - 控制實際責任人
    - 適用且已生效要求/合約政策
    level_selection: 由專案 Profile + 核准矩陣決定；不可由框架或 AI 自動推定
    no_evidence: review
  inspection:
    search_targets:
    - 敏感資料庫及備份
    - 金鑰管理、加密範圍及權限
    review_instructions:
    - 檢查相關程式碼、設定與呼叫鏈，確認是否有外部或平台控制責任。
    - 記錄觸發條件、正常行為與繞過/失效情境。
    - 將檢查結果與當前 Commit 及證據來源綁定，避免沿用前次專案結論。
    legacy_inspection_hints:
    - 辨識個資欄位
    - DB/備份加密
    - 欄位級保護與金鑰
    verification_method: source_plus_deployment_evidence
  assessment:
    pass: 依資料分級及正式要求提供適當靜態加密
    fail: 高敏感資料違反要求以明文存放且無替代控制
    review: 缺少必要的程式碼、部署、測試或制度證據；不以關鍵字未命中推定符合。

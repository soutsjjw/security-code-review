  category: AC
  control_objective: 驗證遠端存取的授權與來源要求
  rule_version: 2.0.0-rc1
  control_type: hybrid
  origin:
    legacy_id: AC-06
    legacy_title: 遠端存取授權過濾
    legacy_levels: 普/中/高
    legal_equivalence_verified: false
  applicability:
    must_assess_when: 系統提供遠端存取功能、API 或管理入口
    may_be_not_applicable_when: 未提供任何遠端服務
    decision_criteria:
    - 功能是否存在
    - 系統處理資料分類
    - 控制實際責任人
    - 適用且已生效要求/合約政策
    level_selection: 由專案 Profile + 核准矩陣決定；不可由框架或 AI 自動推定
    no_evidence: review

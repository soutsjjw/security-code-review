    - 將檢查結果與當前 Commit 及證據來源綁定，避免沿用前次專案結論。
    legacy_inspection_hints:
    - 追蹤對外端點
    - 授權 Policy
    - API Key
    - Tenant
    - 來源限制
    verification_method: source_plus_deployment_evidence
  assessment:
    pass: 遠端請求依契約完成身分與存取驗證
    fail: 缺少必需的授權條件而可存取敏感功能
    review: 缺少必要的程式碼、部署、測試或制度證據；不以關鍵字未命中推定符合。
    not_applicable: 確認本系統沒有相關功能或控制義務，且具體記載不適用原因；若由其他層實作則應追查其證據。
    compliance_priority:
    - 適用且已施行的法律/強制規範
    - 有效合約或受核准政策
    - 本公司核准的安全基線
    - 非強制參考標準
  evidence_requirements:
    what_to_collect: Endpoint、Middleware、Handler、部署網路規則
    minimum:
    - 實際來源（檔案/組態/測試/制度或部署佐證）
    - 證據與判定的因果說明
    - 檢查日期及版本/環境識別
    source_locator:
    - repository_relative_path
    - line_start
    - line_end
    - git_revision
    external_locator:
    - artifact_id
    - owner
    - evidence_date
    redaction: 不得將個資、完整 Token、API Key、密碼寫入報告
  manual_review: 來源 IP 是否為正式控制要求
  remediation_guidance: 集中執行存取控制並建立測試
  risk:
    default_severity: not_preassigned
    factors:
    - 受影響資料敏感度
    - 攻擊可行性與可利用路徑
    - 暴露面
    - 受影響使用者/系統範圍
    - 既有補償控制
    severity_required_for: validated_findings_only
  normative_notes: 不可將缺少 API 來源 IP 白名單直接判缺失；應依介接契約/系統風險決定。
  references:
    technical_requirements:

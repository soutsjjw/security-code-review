- id: AC-05
  title: Process 以一般使用者權限執行
  category: AC
  control_objective: 避免服務以過高系統權限執行
  rule_version: 2.0.0-rc1
  control_type: hybrid
  origin:
    legacy_id: AC-05
    legacy_title: Process 以一般使用者權限執行
    legacy_levels: 中/高
    legal_equivalence_verified: false
  applicability:
    must_assess_when: 部署執行環境有作業系統身分與權限
    may_be_not_applicable_when: 不包含任何可控之服務執行身分且已界定責任
    decision_criteria:
    - 功能是否存在
    - 系統處理資料分類
    - 控制實際責任人
    - 適用且已生效要求/合約政策
    level_selection: 由專案 Profile + 核准矩陣決定；不可由框架或 AI 自動推定
    no_evidence: review
  inspection:
    search_targets:
    - AppPool/Container/Service 執行身分
    - 主機權限與部署帳號
    review_instructions:
    - 檢查相關程式碼、設定與呼叫鏈，確認是否有外部或平台控制責任。
    - 記錄觸發條件、正常行為與繞過/失效情境。
    - 將檢查結果與當前 Commit 及證據來源綁定，避免沿用前次專案結論。
    legacy_inspection_hints:
    - 檢查 IIS App Pool
    - Windows Service
    - 容器 USER
    - 檔案 ACL
    verification_method: source_plus_deployment_evidence
  assessment:
    pass: 執行身分符合最小系統權限需求
    fail: 應用程式不必要地以系統管理員或 root 執行
    review: 缺少必要的程式碼、部署、測試或制度證據；不以關鍵字未命中推定符合。
    not_applicable: 確認本系統沒有相關功能或控制義務，且具體記載不適用原因；若由其他層實作則應追查其證據。
    compliance_priority:
    - 適用且已施行的法律/強制規範
    - 有效合約或受核准政策
    - 本公司核准的安全基線
    - 非強制參考標準
  evidence_requirements:
    what_to_collect: 部署設定、服務帳號、容器映像設定
    minimum:
    - 實際來源（檔案/組態/測試/制度或部署佐證）
    - 證據與判定的因果說明
    - 檢查日期及版本/環境識別
    source_locator:
    - repository_relative_path
    - line_start
    - line_end
    - git_revision
    external_locator:
    - artifact_id
    - owner
    - evidence_date
    redaction: 不得將個資、完整 Token、API Key、密碼寫入報告
  manual_review: 主機實際執行身分
  remediation_guidance: 改用專用非特權身分及最小 ACL
  risk:
    default_severity: not_preassigned
    factors:
    - 受影響資料敏感度
    - 攻擊可行性與可利用路徑
    - 暴露面
    - 受影響使用者/系統範圍
    - 既有補償控制
    severity_required_for: validated_findings_only
  normative_notes: 只能從原始碼推測最低權限；Pass 須檢視實際執行身分及權限。

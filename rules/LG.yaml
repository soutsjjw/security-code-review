category: LG
ruleset_version: 2.0.0
rules:
- id: LG-01
  title: 安全事件日誌記錄
  category: LG
  control_objective: 記錄有助偵測安全事件的必要資料
  rule_version: 2.0.0
  control_type: technical
  origin:
    legacy_id: LG-01
    legacy_title: 安全事件日誌記錄
    legacy_levels: 普/中/高
    legal_equivalence_verified: false
  applicability:
    must_assess_when: 系統執行登入、授權、敏感資料存取或安全相關操作
    may_be_not_applicable_when: 完全沒有安全相關事件，須由功能盤點佐證
    decision_criteria:
    - 功能是否存在
    - 系統處理資料分類
    - 控制實際責任人
    - 適用且已生效要求/合約政策
    level_selection: 由專案 Profile + 核准矩陣決定；不可由框架或 AI 自動推定
    no_evidence: review
  inspection:
    search_targets:
    - 登入/授權/拒絕事件
    - 稽核涵蓋範圍
    review_instructions:
    - 檢查相關程式碼、設定與呼叫鏈，確認是否有外部或平台控制責任。
    - 記錄觸發條件、正常行為與繞過/失效情境。
    - 將檢查結果與當前 Commit 及證據來源綁定，避免沿用前次專案結論。
    legacy_inspection_hints:
    - 檢查登入失敗
    - 授權拒絕
    - 變更權限
    - Token 事件
    verification_method: source_and_test
  assessment:
    pass: 關鍵安全事件有一致紀錄且能追查
    fail: 重要安全事件缺失且無替代日誌
    review: 缺少必要的程式碼、部署、測試或制度證據；不以關鍵字未命中推定符合。
    not_applicable: 確認本系統沒有相關功能或控制義務，且具體記載不適用原因；若由其他層實作則應追查其證據。
    compliance_priority:
    - 適用且已施行的法律/強制規範
    - 有效合約或受核准政策
    - 本公司核准的安全基線
    - 非強制參考標準
  evidence_requirements:
    what_to_collect: 日誌程式、事件測試、範例日誌
    minimum:
    - 實際來源（檔案/組態/測試/制度或部署佐證）
    - 證據與判定的因果說明
    - 檢查日期及版本/環境識別
    source_locator:
    - repository_relative_path
    - line_start
    - line_end
    - git_revision
    external_locator:
    - artifact_id
    - owner
    - evidence_date
    redaction: 不得將個資、完整 Token、API Key、密碼寫入報告
  manual_review: 外部 IdP/WAF 的紀錄責任
  remediation_guidance: 補齊安全事件與關聯識別碼
  risk:
    default_severity: not_preassigned
    factors:
    - 受影響資料敏感度
    - 攻擊可行性與可利用路徑
    - 暴露面
    - 受影響使用者/系統範圍
    - 既有補償控制
    severity_required_for: validated_findings_only
  normative_notes: 檢核要求須以核定適用矩陣、風險情境和控制責任判定；不得單以工具警示定性。
  references:
    technical_requirements:
    - standard_id: OWASP-ASVS
      version: 5.0.0
      requirement_id: v5.0.0-16.3.1
      mapping_status: verified_to_official_requirement
      mapping_type: relevant_requirement_not_full_equivalence
      source: https://raw.githubusercontent.com/OWASP/ASVS/v5.0.0/5.0/docs_en/OWASP_Application_Security_Verification_Standard_5.0.0_en.json
    - standard_id: OWASP-ASVS
      version: 5.0.0
      requirement_id: v5.0.0-16.3.2
      mapping_status: verified_to_official_requirement
      mapping_type: relevant_requirement_not_full_equivalence
      source: https://raw.githubusercontent.com/OWASP/ASVS/v5.0.0/5.0/docs_en/OWASP_Application_Security_Verification_Standard_5.0.0_en.json
    risk_taxonomy:
    - standard_id: OWASP-TOP10
      version: '2025'
      category_id: A09:2025
      mapping_type: suggested_risk_classification_not_a_compliance_clause
    taiwan_web_guideline:
      standard_id: NICS-WEB-GUIDE
      version: '3.2'
      mapping_status: document_version_verified_clause_mapping_pending
    taiwan_legal_mapping:
      status: not_determined_per_project
      note: 不得將參考指引視為自動對所有機關/公司具法定強制力；須依適用對象核定。
  governance:
    control_owner: project_owner_or_delegated_provider
    approval_status: pending_security_signoff
    exception_policy: 不得由 AI 自行豁免；需填寫核准、期限、風險與補償控制
- id: LG-02
  title: 管理者行為稽核
  category: LG

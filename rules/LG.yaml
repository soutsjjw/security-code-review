- id: LG-10
  title: 資料完整性雜湊
  category: LG
  control_objective: 保護高保證等級資料完整性
  rule_version: 2.0.0
  control_type: technical
  origin:
    legacy_id: LG-10
    legacy_title: 資料完整性雜湊
    legacy_levels: 高
    legal_equivalence_verified: false
  applicability:
    must_assess_when: 系統依政策必須提供不可竄改或高保證的完整性驗證
    may_be_not_applicable_when: 正式政策與風險評估未要求此類強控制
    decision_criteria:
    - 功能是否存在
    - 系統處理資料分類
    - 控制實際責任人
    - 適用且已生效要求/合約政策
    level_selection: 由專案 Profile + 核准矩陣決定；不可由框架或 AI 自動推定
    no_evidence: review
  inspection:
    search_targets:
    - 資料/紀錄完整性機制
    - 適用要求與偵測能力
    review_instructions:
    - 檢查相關程式碼、設定與呼叫鏈，確認是否有外部或平台控制責任。
    - 記錄觸發條件、正常行為與繞過/失效情境。
    - 將檢查結果與當前 Commit 及證據來源綁定，避免沿用前次專案結論。
    legacy_inspection_hints:
    - 核對規範是否要求雜湊鏈
    - 簽章或完整性驗證
    verification_method: source_and_test
  assessment:
    pass: 採用所需的完整性驗證且金鑰安全
    fail: 必要的完整性檢驗缺失或可被任意重算
    review: 缺少必要的程式碼、部署、測試或制度證據；不以關鍵字未命中推定符合。
    not_applicable: 確認本系統沒有相關功能或控制義務，且具體記載不適用原因；若由其他層實作則應追查其證據。
    compliance_priority:
    - 適用且已施行的法律/強制規範
    - 有效合約或受核准政策
    - 本公司核准的安全基線
    - 非強制參考標準
  evidence_requirements:
    what_to_collect: 簽章/雜湊流程、驗證機制、金鑰管理
    minimum:
    - 實際來源（檔案/組態/測試/制度或部署佐證）
    - 證據與判定的因果說明
    - 檢查日期及版本/環境識別
    source_locator:
    - repository_relative_path
    - line_start
    - line_end
    - git_revision
    external_locator:
    - artifact_id
    - owner
    - evidence_date
    redaction: 不得將個資、完整 Token、API Key、密碼寫入報告
  manual_review: 哪些資料必須具完整性防竄改要求
  remediation_guidance: 導入簽章或雜湊鏈與離線驗證
  risk:
    default_severity: not_preassigned
    factors:
    - 受影響資料敏感度
    - 攻擊可行性與可利用路徑
    - 暴露面
    - 受影響使用者/系統範圍
    - 既有補償控制
    severity_required_for: validated_findings_only
  normative_notes: 完整性雜湊須依適用性與完整性威脅核定，非一律所有系統強制。
  references:
    technical_requirements: []
    risk_taxonomy:

- id: LG-05
  title: 日誌儲存容量管理
  category: LG
  control_objective: 避免日誌無限成長或過早遺失
  rule_version: 2.0.0
  control_type: hybrid
  origin:
    legacy_id: LG-05
    legacy_title: 日誌儲存容量管理
    legacy_levels: 普/中/高
    legal_equivalence_verified: false
  applicability:
    must_assess_when: 系統有日誌保存或容量管理責任
    may_be_not_applicable_when: 所有日誌由外部平台全權代管且有佐證，仍需評估繼承控制
    decision_criteria:
    - 功能是否存在
    - 系統處理資料分類
    - 控制實際責任人
    - 適用且已生效要求/合約政策
    level_selection: 由專案 Profile + 核准矩陣決定；不可由框架或 AI 自動推定
    no_evidence: review
  inspection:
    search_targets:
    - 輪替/保留/容量策略
    - 告警與實際儲存限制
    review_instructions:
    - 檢查相關程式碼、設定與呼叫鏈，確認是否有外部或平台控制責任。
    - 記錄觸發條件、正常行為與繞過/失效情境。
    - 將檢查結果與當前 Commit 及證據來源綁定，避免沿用前次專案結論。

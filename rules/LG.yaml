    - line_start
    - line_end
    - git_revision
    external_locator:
    - artifact_id
    - owner
    - evidence_date
    redaction: 不得將個資、完整 Token、API Key、密碼寫入報告
  manual_review: 跨系統追蹤識別碼
  remediation_guidance: 採統一事件欄位與結構化紀錄
  risk:
    default_severity: not_preassigned

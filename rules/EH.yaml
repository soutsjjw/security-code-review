- id: EH-06
  title: 預設帳密與設定變更
  category: EH
  control_objective: 避免預設密碼及弱化組態
  rule_version: 2.0.0
  control_type: hybrid
  origin:
    legacy_id: EH-06
    legacy_title: 預設帳密與設定變更
    legacy_levels: 普/中/高
    legal_equivalence_verified: false
  applicability:
    must_assess_when: 系統或依賴服務有帳密、憑證與預設設定
    may_be_not_applicable_when: 不存在任何可管理的預設驗證資訊／設定
    decision_criteria:
    - 功能是否存在
    - 系統處理資料分類
    - 控制實際責任人
    - 適用且已生效要求/合約政策
    level_selection: 由專案 Profile + 核准矩陣決定；不可由框架或 AI 自動推定
    no_evidence: review
  inspection:
    search_targets:
    - 預設帳密/範例組態
    - 部署時的基線變更
    review_instructions:
    - 檢查相關程式碼、設定與呼叫鏈，確認是否有外部或平台控制責任。
    - 記錄觸發條件、正常行為與繞過/失效情境。
    - 將檢查結果與當前 Commit 及證據來源綁定，避免沿用前次專案結論。
    legacy_inspection_hints:

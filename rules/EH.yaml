    - owner
    - evidence_date
    redaction: 不得將個資、完整 Token、API Key、密碼寫入報告
  manual_review: 外部監控平台與值班制度
  remediation_guidance: 建立告警、分級與演練機制
  risk:
    default_severity: not_preassigned

  rule_version: 2.0.0
  control_type: hybrid
  origin:
    legacy_id: BC-04
    legacy_title: 系統文件管理
    legacy_levels: 普/中/高
    legal_equivalence_verified: false
  applicability:
    must_assess_when: 系統正式運作並需部署、維護或事故處置
    may_be_not_applicable_when: 非正式管理之一次性資產且經核准
    decision_criteria:
    - 功能是否存在
    - 系統處理資料分類
    - 控制實際責任人
    - 適用且已生效要求/合約政策

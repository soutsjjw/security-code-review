- id: BC-06
  title: 版本控制與變更管理
  category: BC
  control_objective: 讓變更可追溯與可控
  rule_version: 2.0.0
  control_type: hybrid
  origin:
    legacy_id: BC-06
    legacy_title: 版本控制與變更管理
    legacy_levels: 中/高
    legal_equivalence_verified: false
  applicability:
    must_assess_when: 系統經過程式、設定或部署變更
    may_be_not_applicable_when: 沒有需控管的變更，通常不適用於正式系統
    decision_criteria:
    - 功能是否存在
    - 系統處理資料分類
    - 控制實際責任人
    - 適用且已生效要求/合約政策
    level_selection: 由專案 Profile + 核准矩陣決定；不可由框架或 AI 自動推定
    no_evidence: review
  inspection:
    review_scope: project
    review_tier: standard
    search_targets:
    - 審查/簽核/變更紀錄
    - PR/CI 追溯性
    review_instructions:
    - 檢查相關程式碼、設定與呼叫鏈，確認是否有外部或平台控制責任。
    - 記錄觸發條件、正常行為與繞過/失效情境。
    - 將檢查結果與當前 Commit 及證據來源綁定，避免沿用前次專案結論。
    legacy_inspection_hints:
    - 檢查 PR
    - 審核
    - 分支保護
    - 發版與 Migration
    verification_method: source_plus_deployment_evidence
  assessment:
    pass: 程式及部署變更可追蹤且通過核准流程
    fail: 重大變更可繞過必要審核或未留紀錄
    review: 缺少必要的程式碼、部署、測試或制度證據；不以關鍵字未命中推定符合。
    not_applicable: 確認本系統沒有相關功能或控制義務，且具體記載不適用原因；若由其他層實作則應追查其證據。
    compliance_priority:
    - 適用且已施行的法律/強制規範
    - 有效合約或受核准政策
    - 本公司核准的安全基線
    - 非強制參考標準
  evidence_requirements:
    what_to_collect: Git 規則、CI、審核紀錄
    minimum:
    - 實際來源（檔案/組態/測試/制度或部署佐證）
    - 證據與判定的因果說明
    - 檢查日期及版本/環境識別
    source_locator:
    - repository_relative_path
    - line_start
    - line_end
    - git_revision
    external_locator:
    - artifact_id
    - owner
    - evidence_date
    redaction: 不得將個資、完整 Token、API Key、密碼寫入報告
  manual_review: 企業變更管理制度
  remediation_guidance: 啟用 Branch Protection 與審核流程
  risk:
    default_severity: not_preassigned
    factors:
    - 受影響資料敏感度
    - 攻擊可行性與可利用路徑
    - 暴露面
    - 受影響使用者/系統範圍
    - 既有補償控制
    severity_required_for: validated_findings_only
  normative_notes: 檢核要求須以核定適用矩陣、風險情境和控制責任判定；不得單以工具警示定性。
  references:
    technical_requirements: []
    risk_taxonomy: []
    taiwan_web_guideline:
      standard_id: NICS-WEB-GUIDE
      version: '3.2'
      mapping_status: document_version_verified_clause_mapping_pending
    taiwan_legal_mapping:
      status: not_determined_per_project
      note: 不得將參考指引視為自動對所有機關/公司具法定強制力；須依適用對象核定。
  governance:
    control_owner: project_owner_or_delegated_provider
    approval_status: pending_security_signoff
    exception_policy: 不得由 AI 自行豁免；需填寫核准、期限、風險與補償控制
- id: BC-07
  title: 備援啟動演練
  category: BC
  control_objective: 驗證備援機制在事故時可用
  rule_version: 2.0.0
  control_type: procedural
  origin:
    legacy_id: BC-07
    legacy_title: 備援啟動演練
    legacy_levels: 高
    legal_equivalence_verified: false
  applicability:
    must_assess_when: 系統具備備援方案且正式制度要求復原或切換演練
    may_be_not_applicable_when: 沒有備援／DR 演練義務
    decision_criteria:
    - 功能是否存在
    - 系統處理資料分類
    - 控制實際責任人
    - 適用且已生效要求/合約政策
    level_selection: 由專案 Profile + 核准矩陣決定；不可由框架或 AI 自動推定
    no_evidence: review
  inspection:
    review_scope: project
    review_tier: standard
    search_targets:
    - 容災啟動演練
    - 切換時間、成功率與缺失追蹤
    review_instructions:
    - 檢查相關程式碼、設定與呼叫鏈，確認是否有外部或平台控制責任。
    - 記錄觸發條件、正常行為與繞過/失效情境。
    - 將檢查結果與當前 Commit 及證據來源綁定，避免沿用前次專案結論。
    legacy_inspection_hints:
    - 檢查 DR 計畫
    - 測試紀錄與 RTO/RPO
    verification_method: external_operating_evidence
  assessment:
    pass: 依規定完成備援啟動演練並追蹤問題
    fail: 需要備援演練卻未執行或結果不符要求
    review: 缺少必要的程式碼、部署、測試或制度證據；不以關鍵字未命中推定符合。
    not_applicable: 確認本系統沒有相關功能或控制義務，且具體記載不適用原因；若由其他層實作則應追查其證據。
    compliance_priority:
    - 適用且已施行的法律/強制規範
    - 有效合約或受核准政策
    - 本公司核准的安全基線
    - 非強制參考標準
  evidence_requirements:
    what_to_collect: 演練報告、切換記錄、改善項目
    minimum:
    - 實際來源（檔案/組態/測試/制度或部署佐證）
    - 證據與判定的因果說明
    - 檢查日期及版本/環境識別
    source_locator:
    - repository_relative_path
    - line_start
    - line_end
    - git_revision
    external_locator:
    - artifact_id
    - owner
    - evidence_date
    redaction: 不得將個資、完整 Token、API Key、密碼寫入報告
  manual_review: 實際機房及備援配置
  remediation_guidance: 建立週期演練和改善追蹤
  risk:
    default_severity: not_preassigned
    factors:
    - 受影響資料敏感度
    - 攻擊可行性與可利用路徑
    - 暴露面
    - 受影響使用者/系統範圍
    - 既有補償控制
    severity_required_for: validated_findings_only
  normative_notes: 屬營運驗證控制，沒有演練紀錄不能只靠程式碼判通過。
  references:
    technical_requirements: []
    risk_taxonomy: []
    taiwan_web_guideline:
      standard_id: NICS-WEB-GUIDE
      version: '3.2'
      mapping_status: document_version_verified_clause_mapping_pending
    taiwan_legal_mapping:
      status: not_determined_per_project
      note: 不得將參考指引視為自動對所有機關/公司具法定強制力；須依適用對象核定。
  governance:
    control_owner: project_owner_or_delegated_provider
    approval_status: pending_security_signoff
    exception_policy: 不得由 AI 自行豁免；需填寫核准、期限、風險與補償控制

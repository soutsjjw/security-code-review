    no_evidence: review
  inspection:
    search_targets:
    - 個資庫/快取/備份
    - 加密/隔離/權限等效措施與核定
    review_instructions:
    - 檢查相關程式碼、設定與呼叫鏈，確認是否有外部或平台控制責任。
    - 記錄觸發條件、正常行為與繞過/失效情境。
    - 將檢查結果與當前 Commit 及證據來源綁定，避免沿用前次專案結論。

- id: PD-04
  title: 個資存取日誌
  category: PD
  control_objective: 追溯個資存取使用及異常
  rule_version: 2.0.0
  control_type: technical
  origin:
    legacy_id: PD-04
    legacy_title: 個資存取日誌
    legacy_levels: 全等級
    legal_equivalence_verified: false
  applicability:
    must_assess_when: 系統提供個資查詢、讀取、異動或匯出
    may_be_not_applicable_when: 不處理個資或沒有相關存取作業
    decision_criteria:
    - 功能是否存在
    - 系統處理資料分類
    - 控制實際責任人
    - 適用且已生效要求/合約政策
    level_selection: 由專案 Profile + 核准矩陣決定；不可由框架或 AI 自動推定
    no_evidence: review
  inspection:
    search_targets:
    - 個資讀取/下載/變更事件
    - 稽核權限、留存與防竄改
    review_instructions:
    - 檢查相關程式碼、設定與呼叫鏈，確認是否有外部或平台控制責任。
    - 記錄觸發條件、正常行為與繞過/失效情境。
    - 將檢查結果與當前 Commit 及證據來源綁定，避免沿用前次專案結論。

  rule_version: 2.0.0
  control_type: hybrid
  origin:
    legacy_id: PD-05
    legacy_title: 個資儲存加密
    legacy_levels: 全等級
    legal_equivalence_verified: false
  applicability:
    must_assess_when: 系統保存個資於資料庫、快取、檔案或備份

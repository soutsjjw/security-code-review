- id: PD-06
  title: 遠端存取個資限制
  category: PD
  control_objective: 限制遠端個資 API 存取
  rule_version: 2.0.0
  control_type: technical
  origin:
    legacy_id: PD-06
    legacy_title: 遠端存取個資限制
    legacy_levels: 全等級
    legal_equivalence_verified: false
  applicability:
    must_assess_when: 系統對外或跨邊界提供個資存取／交換服務
    may_be_not_applicable_when: 沒有跨邊界個資存取或交換服務
    decision_criteria:
    - 功能是否存在
    - 系統處理資料分類
    - 控制實際責任人
    - 適用且已生效要求/合約政策
    level_selection: 由專案 Profile + 核准矩陣決定；不可由框架或 AI 自動推定
    no_evidence: review
  inspection:
    search_targets:
    - 個資 API 身分與授權
    - 來源、目的與存取頻率控管
    review_instructions:
    - 檢查相關程式碼、設定與呼叫鏈，確認是否有外部或平台控制責任。
    - 記錄觸發條件、正常行為與繞過/失效情境。
    - 將檢查結果與當前 Commit 及證據來源綁定，避免沿用前次專案結論。
    legacy_inspection_hints:
    - 檢查 Token
    - Client Scope
    - IP
    - Tenant
    - 最小權限
    verification_method: source_and_test
  assessment:
    pass: 符合介接契約且來源/用途/資料範圍受控
    fail: 缺少必需身分或資料範圍限制
    review: 缺少必要的程式碼、部署、測試或制度證據；不以關鍵字未命中推定符合。
    not_applicable: 確認本系統沒有相關功能或控制義務，且具體記載不適用原因；若由其他層實作則應追查其證據。
    compliance_priority:
    - 適用且已施行的法律/強制規範
    - 有效合約或受核准政策
    - 本公司核准的安全基線
    - 非強制參考標準
  evidence_requirements:
    what_to_collect: API Policy、Client DB、網路設定
    minimum:
    - 實際來源（檔案/組態/測試/制度或部署佐證）
    - 證據與判定的因果說明
    - 檢查日期及版本/環境識別
    source_locator:
    - repository_relative_path
    - line_start
    - line_end
    - git_revision
    external_locator:
    - artifact_id
    - owner
    - evidence_date
    redaction: 不得將個資、完整 Token、API Key、密碼寫入報告
  manual_review: IP 限制是否為明訂要求
  remediation_guidance: 增加來源驗證、Scope 與資料授權
  risk:
    default_severity: not_preassigned
    factors:
    - 受影響資料敏感度
    - 攻擊可行性與可利用路徑
    - 暴露面
    - 受影響使用者/系統範圍
    - 既有補償控制
    severity_required_for: validated_findings_only
  normative_notes: 不以 IP 白名單當作唯一遠端存取控制；須評估使用者/Client 身分、權限、來源及目的。
  references:
    technical_requirements: []
    risk_taxonomy: []
    taiwan_web_guideline:
      standard_id: NICS-WEB-GUIDE
      version: '3.2'
      mapping_status: document_version_verified_clause_mapping_pending
    taiwan_legal_mapping:
      status: not_determined_per_project
      note: 不得將參考指引視為自動對所有機關/公司具法定強制力；須依適用對象核定。
  governance:
    control_owner: project_owner_or_delegated_provider
    approval_status: pending_security_signoff
    exception_policy: 不得由 AI 自行豁免；需填寫核准、期限、風險與補償控制

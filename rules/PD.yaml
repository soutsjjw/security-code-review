category: PD
ruleset_version: 2.0.0
rules:
- id: PD-01
  title: 個資蒐集合法性
  category: PD
  control_objective: 確保蒐集個資有合法依據與告知
  rule_version: 2.0.0
  control_type: hybrid
  origin:
    legacy_id: PD-01
    legacy_title: 個資蒐集合法性
    legacy_levels: 全等級
    legal_equivalence_verified: false
  applicability:
    must_assess_when: 系統蒐集可識別個人之資料
    may_be_not_applicable_when: 不蒐集個資且資料盤點已確認
    decision_criteria:
    - 功能是否存在
    - 系統處理資料分類
    - 控制實際責任人
    - 適用且已生效要求/合約政策
    level_selection: 由專案 Profile + 核准矩陣決定；不可由框架或 AI 自動推定
    no_evidence: review
  inspection:
    search_targets:
    - 資料蒐集目的/法律依據
    - 告知及合法例外條件
    review_instructions:
    - 檢查相關程式碼、設定與呼叫鏈，確認是否有外部或平台控制責任。
    - 記錄觸發條件、正常行為與繞過/失效情境。
    - 將檢查結果與當前 Commit 及證據來源綁定，避免沿用前次專案結論。
    legacy_inspection_hints:
    - 檢查表單
    - 告知事項
    - 目的與資料最小化
    verification_method: source_plus_deployment_evidence
  assessment:
    pass: 蒐集目的、法定依據及適用告知義務獲確認
    fail: 應告知而未告知或超出合法必要範圍
    review: 缺少必要的程式碼、部署、測試或制度證據；不以關鍵字未命中推定符合。
    not_applicable: 確認本系統沒有相關功能或控制義務，且具體記載不適用原因；若由其他層實作則應追查其證據。
    compliance_priority:
    - 適用且已施行的法律/強制規範
    - 有效合約或受核准政策
    - 本公司核准的安全基線
    - 非強制參考標準
  evidence_requirements:
    what_to_collect: 表單、隱私告知、資料欄位
    minimum:
    - 實際來源（檔案/組態/測試/制度或部署佐證）
    - 證據與判定的因果說明
    - 檢查日期及版本/環境識別
    source_locator:
    - repository_relative_path
    - line_start
    - line_end
    - git_revision
    external_locator:
    - artifact_id
    - owner
    - evidence_date
    redaction: 不得將個資、完整 Token、API Key、密碼寫入報告
  manual_review: 同意不是所有蒐集情境唯一合法依據；需法務確認
  remediation_guidance: 補齊適用告知並精簡收集
  risk:
    default_severity: not_preassigned
    factors:
    - 受影響資料敏感度
    - 攻擊可行性與可利用路徑
    - 暴露面
    - 受影響使用者/系統範圍
    - 既有補償控制
    severity_required_for: validated_findings_only
  normative_notes: 個資合法蒐集不必然都要取得同意；依現行法定蒐集依據及告知例外判斷。
  references:
    technical_requirements: []
    risk_taxonomy: []
    taiwan_web_guideline:
      standard_id: NICS-WEB-GUIDE
      version: '3.2'
      mapping_status: document_version_verified_clause_mapping_pending
    taiwan_legal_mapping:
      status: not_determined_per_project
      note: 不得將參考指引視為自動對所有機關/公司具法定強制力；須依適用對象核定。
  governance:
    control_owner: project_owner_or_delegated_provider
    approval_status: pending_security_signoff
    exception_policy: 不得由 AI 自行豁免；需填寫核准、期限、風險與補償控制
- id: PD-02
  title: 個資顯示去識別化
  category: PD
  control_objective: 降低顯示或提供個資的不必要暴露
  rule_version: 2.0.0
  control_type: technical
  origin:
    legacy_id: PD-02
    legacy_title: 個資顯示去識別化
    legacy_levels: 全等級
    legal_equivalence_verified: false
  applicability:
    must_assess_when: 系統展示、匯出、傳送或提供個資
    may_be_not_applicable_when: 不處理或輸出個資
    decision_criteria:
    - 功能是否存在
    - 系統處理資料分類
    - 控制實際責任人
    - 適用且已生效要求/合約政策
    level_selection: 由專案 Profile + 核准矩陣決定；不可由框架或 AI 自動推定
    no_evidence: review
  inspection:
    search_targets:
    - 回應 DTO 與畫面欄位
    - 最小化/遮罩與目的限制
    review_instructions:
    - 檢查相關程式碼、設定與呼叫鏈，確認是否有外部或平台控制責任。
    - 記錄觸發條件、正常行為與繞過/失效情境。
    - 將檢查結果與當前 Commit 及證據來源綁定，避免沿用前次專案結論。
    legacy_inspection_hints:
    - 盤點 API 回應
    - 前端顯示
    - Token claims
    - 匯出
    verification_method: source_and_test
  assessment:
    pass: 依角色與目的最小化、遮蔽或去識別化
    fail: 無業務必要卻回傳完整敏感識別資料
    review: 缺少必要的程式碼、部署、測試或制度證據；不以關鍵字未命中推定符合。
    not_applicable: 確認本系統沒有相關功能或控制義務，且具體記載不適用原因；若由其他層實作則應追查其證據。
    compliance_priority:
    - 適用且已施行的法律/強制規範
    - 有效合約或受核准政策
    - 本公司核准的安全基線
    - 非強制參考標準
  evidence_requirements:
    what_to_collect: DTO、Mapper、API 回應、權限矩陣
    minimum:
    - 實際來源（檔案/組態/測試/制度或部署佐證）
    - 證據與判定的因果說明
    - 檢查日期及版本/環境識別
    source_locator:
    - repository_relative_path
    - line_start
    - line_end
    - git_revision
    external_locator:
    - artifact_id
    - owner
    - evidence_date
    redaction: 不得將個資、完整 Token、API Key、密碼寫入報告
  manual_review: 依法或業務要求完整提供的例外
  remediation_guidance: 欄位級授權、遮蔽與資料最小化
  risk:
    default_severity: not_preassigned
    factors:
    - 受影響資料敏感度
    - 攻擊可行性與可利用路徑
    - 暴露面
    - 受影響使用者/系統範圍
    - 既有補償控制
    severity_required_for: validated_findings_only
  normative_notes: 遮罩、去識別化、資料最小化用途不同；依合法目的及授權確認。
  references:
    technical_requirements:
    - standard_id: OWASP-ASVS
      version: 5.0.0
      requirement_id: v5.0.0-14.2.6
      mapping_status: verified_to_official_requirement
      mapping_type: relevant_requirement_not_full_equivalence
      source: https://raw.githubusercontent.com/OWASP/ASVS/v5.0.0/5.0/docs_en/OWASP_Application_Security_Verification_Standard_5.0.0_en.json
    risk_taxonomy: []
    taiwan_web_guideline:
      standard_id: NICS-WEB-GUIDE
      version: '3.2'
      mapping_status: document_version_verified_clause_mapping_pending
    taiwan_legal_mapping:
      status: not_determined_per_project
      note: 不得將參考指引視為自動對所有機關/公司具法定強制力；須依適用對象核定。
  governance:
    control_owner: project_owner_or_delegated_provider
    approval_status: pending_security_signoff
    exception_policy: 不得由 AI 自行豁免；需填寫核准、期限、風險與補償控制

category: IN
ruleset_version: 2.0.0
rules:
- id: IN-01
  title: SQL Injection 防護
  category: IN
  control_objective: 防止外部輸入改變 SQL 語意
  rule_version: 2.0.0
  control_type: technical
  origin:
    legacy_id: IN-01
    legacy_title: SQL Injection 防護
    legacy_levels: 普/中/高
    legal_equivalence_verified: false
  applicability:
    must_assess_when: 系統產生、操作或執行 SQL 查詢
    may_be_not_applicable_when: 未使用 SQL 或相關查詢組件
    decision_criteria:
    - 功能是否存在
    - 系統處理資料分類
    - 控制實際責任人
    - 適用且已生效要求/合約政策
    level_selection: 由專案 Profile + 核准矩陣決定；不可由框架或 AI 自動推定
    no_evidence: review
  inspection:
    review_scope: cross_file
    review_tier: high
    search_targets:
    - 原生 SQL/ORM 查詢
    - 不可信輸入到資料庫的流向
    review_instructions:
    - 檢查相關程式碼、設定與呼叫鏈，確認是否有外部或平台控制責任。
    - 記錄觸發條件、正常行為與繞過/失效情境。
    - 將檢查結果與當前 Commit 及證據來源綁定，避免沿用前次專案結論。
    legacy_inspection_hints:
    - 檢查 ORM Raw SQL
    - 字串組合
    - Stored Procedure 與動態排序
    verification_method: source_and_test
  assessment:
    pass: 資料值使用參數化且識別字經允許清單限制
    fail: 使用者輸入直接插入可執行 SQL
    review: 缺少必要的程式碼、部署、測試或制度證據；不以關鍵字未命中推定符合。
    not_applicable: 確認本系統沒有相關功能或控制義務，且具體記載不適用原因；若由其他層實作則應追查其證據。
    compliance_priority:
    - 適用且已施行的法律/強制規範
    - 有效合約或受核准政策
    - 本公司核准的安全基線
    - 非強制參考標準
  evidence_requirements:
    what_to_collect: SQL 呼叫位置、來源追蹤、參數化證據
    minimum:
    - 實際來源（檔案/組態/測試/制度或部署佐證）
    - 證據與判定的因果說明
    - 檢查日期及版本/環境識別
    source_locator:
    - repository_relative_path
    - line_start
    - line_end
    - git_revision
    external_locator:
    - artifact_id
    - owner
    - evidence_date
    redaction: 不得將個資、完整 Token、API Key、密碼寫入報告
  manual_review: 第三方查詢組件與 SP 內容
  remediation_guidance: 採參數化查詢與識別字白名單
  risk:
    default_severity: not_preassigned
    factors:
    - 受影響資料敏感度
    - 攻擊可行性與可利用路徑
    - 暴露面
    - 受影響使用者/系統範圍
    - 既有補償控制
    severity_required_for: validated_findings_only
  normative_notes: 檢核要求須以核定適用矩陣、風險情境和控制責任判定；不得單以工具警示定性。
  references:
    technical_requirements:
    - standard_id: OWASP-ASVS
      version: 5.0.0
      requirement_id: v5.0.0-1.2.4
      mapping_status: verified_to_official_requirement
      mapping_type: relevant_requirement_not_full_equivalence
      source: https://raw.githubusercontent.com/OWASP/ASVS/v5.0.0/5.0/docs_en/OWASP_Application_Security_Verification_Standard_5.0.0_en.json
    risk_taxonomy:
    - standard_id: OWASP-TOP10
      version: '2025'
      category_id: A05:2025
      mapping_type: suggested_risk_classification_not_a_compliance_clause
    taiwan_web_guideline:
      standard_id: NICS-WEB-GUIDE
      version: '3.2'
      mapping_status: document_version_verified_clause_mapping_pending
    taiwan_legal_mapping:
      status: not_determined_per_project
      note: 不得將參考指引視為自動對所有機關/公司具法定強制力；須依適用對象核定。
  governance:
    control_owner: project_owner_or_delegated_provider
    approval_status: pending_security_signoff
    exception_policy: 不得由 AI 自行豁免；需填寫核准、期限、風險與補償控制
- id: IN-02
  title: XSS / 輸出編碼
  category: IN
  control_objective: 防範 XSS 與不安全輸出內容
  rule_version: 2.0.0
  control_type: technical
  origin:
    legacy_id: IN-02
    legacy_title: XSS / 輸出編碼
    legacy_levels: 普/中/高
    legal_equivalence_verified: false
  applicability:
    must_assess_when: 將不可信輸入輸出至 HTML、DOM、Script、CSV 或試算表相容格式
    may_be_not_applicable_when: 沒有相關可執行內容或試算表輸出情境
    decision_criteria:
    - 功能是否存在
    - 系統處理資料分類
    - 控制實際責任人
    - 適用且已生效要求/合約政策
    level_selection: 由專案 Profile + 核准矩陣決定；不可由框架或 AI 自動推定
    no_evidence: review
  inspection:
    review_scope: cross_file
    review_tier: high
    search_targets:
    - HTML/JS 上下文編碼
    - CSV/試算表公式起始字元
    review_instructions:
    - 檢查相關程式碼、設定與呼叫鏈，確認是否有外部或平台控制責任。
    - 記錄觸發條件、正常行為與繞過/失效情境。
    - 將檢查結果與當前 Commit 及證據來源綁定，避免沿用前次專案結論。
    legacy_inspection_hints:
    - 檢查 HTML
    - JS
    - DOM
    - CSV
    - 模板與輸出編碼
    verification_method: source_and_test
  assessment:
    pass: 各輸出情境採正確編碼；CSV 公式注入另納入檢查
    fail: 未信任內容可執行前端腳本或試算表公式
    review: 缺少必要的程式碼、部署、測試或制度證據；不以關鍵字未命中推定符合。
    not_applicable: 確認本系統沒有相關功能或控制義務，且具體記載不適用原因；若由其他層實作則應追查其證據。
    compliance_priority:
    - 適用且已施行的法律/強制規範
    - 有效合約或受核准政策
    - 本公司核准的安全基線
    - 非強制參考標準
  evidence_requirements:
    what_to_collect: 模板/匯出程式、來源到輸出追蹤
    minimum:
    - 實際來源（檔案/組態/測試/制度或部署佐證）
    - 證據與判定的因果說明
    - 檢查日期及版本/環境識別
    source_locator:
    - repository_relative_path
    - line_start
    - line_end
    - git_revision
    external_locator:
    - artifact_id
    - owner
    - evidence_date
    redaction: 不得將個資、完整 Token、API Key、密碼寫入報告
  manual_review: CSV Injection 與 XSS 應分別描述發現
  remediation_guidance: 依輸出情境編碼及 CSV 公式前綴防護
  risk:
    default_severity: not_preassigned
    factors:
    - 受影響資料敏感度
    - 攻擊可行性與可利用路徑
    - 暴露面
    - 受影響使用者/系統範圍
    - 既有補償控制
    severity_required_for: validated_findings_only
  normative_notes: 檢核同時涵蓋 XSS 和 CSV Formula Injection；兩者須分別記錄子檢核結果。
  subchecks:
  - key: xss
    objective: 依輸出情境進行安全編碼/清理
  - key: csv_formula_injection
    objective: 匯出試算表值防止公式注入
  references:
    technical_requirements:
    - standard_id: OWASP-ASVS
      version: 5.0.0
      requirement_id: v5.0.0-1.2.1
      mapping_status: verified_to_official_requirement
      mapping_type: relevant_requirement_not_full_equivalence
      source: https://raw.githubusercontent.com/OWASP/ASVS/v5.0.0/5.0/docs_en/OWASP_Application_Security_Verification_Standard_5.0.0_en.json
    - standard_id: OWASP-ASVS
      version: 5.0.0
      requirement_id: v5.0.0-1.2.10
      mapping_status: verified_to_official_requirement
      mapping_type: relevant_requirement_not_full_equivalence
      source: https://raw.githubusercontent.com/OWASP/ASVS/v5.0.0/5.0/docs_en/OWASP_Application_Security_Verification_Standard_5.0.0_en.json
    risk_taxonomy:
    - standard_id: OWASP-TOP10
      version: '2025'
      category_id: A05:2025
      mapping_type: suggested_risk_classification_not_a_compliance_clause
    taiwan_web_guideline:
      standard_id: NICS-WEB-GUIDE
      version: '3.2'
      mapping_status: document_version_verified_clause_mapping_pending
    taiwan_legal_mapping:
      status: not_determined_per_project
      note: 不得將參考指引視為自動對所有機關/公司具法定強制力；須依適用對象核定。
  governance:
    control_owner: project_owner_or_delegated_provider
    approval_status: pending_security_signoff
    exception_policy: 不得由 AI 自行豁免；需填寫核准、期限、風險與補償控制
- id: IN-03
  title: CSRF 防護
  category: IN
  control_objective: 防止跨站請求偽造
  rule_version: 2.0.0
  control_type: technical
  origin:
    legacy_id: IN-03
    legacy_title: CSRF 防護
    legacy_levels: 普/中/高
    legal_equivalence_verified: false
  applicability:
    must_assess_when: 具備 Cookie 或其他會自動附帶憑證的狀態變更操作
    may_be_not_applicable_when: 無瀏覽器情境下的自動附帶憑證／狀態變更端點
    decision_criteria:
    - 功能是否存在
    - 系統處理資料分類
    - 控制實際責任人
    - 適用且已生效要求/合約政策
    level_selection: 由專案 Profile + 核准矩陣決定；不可由框架或 AI 自動推定
    no_evidence: review
  inspection:
    review_scope: cross_file
    review_tier: high
    search_targets:
    - Cookie 自動隨附的變更請求
    - CSRF Token/SameSite/Origin 驗證
    review_instructions:
    - 檢查相關程式碼、設定與呼叫鏈，確認是否有外部或平台控制責任。
    - 記錄觸發條件、正常行為與繞過/失效情境。
    - 將檢查結果與當前 Commit 及證據來源綁定，避免沿用前次專案結論。
    legacy_inspection_hints:
    - 檢查 Cookie 認證的狀態變更端點
    - AntiForgery
    - SameSite
    - Origin
    verification_method: source_and_test
  assessment:
    pass: 適用端點具可驗證 CSRF 防護或等效安全設計
    fail: 可在跨站情境冒用使用者狀態變更
    review: 缺少必要的程式碼、部署、測試或制度證據；不以關鍵字未命中推定符合。
    not_applicable: 確認本系統沒有相關功能或控制義務，且具體記載不適用原因；若由其他層實作則應追查其證據。
    compliance_priority:
    - 適用且已施行的法律/強制規範
    - 有效合約或受核准政策
    - 本公司核准的安全基線
    - 非強制參考標準
  evidence_requirements:
    what_to_collect: Cookie、API 授權、CSRF Token、測試
    minimum:
    - 實際來源（檔案/組態/測試/制度或部署佐證）
    - 證據與判定的因果說明
    - 檢查日期及版本/環境識別
    source_locator:
    - repository_relative_path
    - line_start
    - line_end
    - git_revision
    external_locator:
    - artifact_id
    - owner
    - evidence_date
    redaction: 不得將個資、完整 Token、API Key、密碼寫入報告
  manual_review: Bearer-only 與 Cookie 架構需分別判斷
  remediation_guidance: 使用 AntiForgery Token 或等效限制
  risk:
    default_severity: not_preassigned
    factors:
    - 受影響資料敏感度
    - 攻擊可行性與可利用路徑
    - 暴露面
    - 受影響使用者/系統範圍
    - 既有補償控制
    severity_required_for: validated_findings_only
  normative_notes: 僅靠 SameSite 或 CORS 不必然充分；需確認認證機制、跨站威脅與伺服端防護。
  references:
    technical_requirements:
    - standard_id: OWASP-ASVS
      version: 5.0.0
      requirement_id: v5.0.0-3.5.1
      mapping_status: verified_to_official_requirement
      mapping_type: relevant_requirement_not_full_equivalence
      source: https://raw.githubusercontent.com/OWASP/ASVS/v5.0.0/5.0/docs_en/OWASP_Application_Security_Verification_Standard_5.0.0_en.json
    risk_taxonomy:
    - standard_id: OWASP-TOP10
      version: '2025'
      category_id: A01:2025
      mapping_type: suggested_risk_classification_not_a_compliance_clause
    taiwan_web_guideline:
      standard_id: NICS-WEB-GUIDE
      version: '3.2'
      mapping_status: document_version_verified_clause_mapping_pending
    taiwan_legal_mapping:
      status: not_determined_per_project
      note: 不得將參考指引視為自動對所有機關/公司具法定強制力；須依適用對象核定。
  governance:
    control_owner: project_owner_or_delegated_provider
    approval_status: pending_security_signoff
    exception_policy: 不得由 AI 自行豁免；需填寫核准、期限、風險與補償控制
- id: IN-04
  title: Command Injection 防護
  category: IN
  control_objective: 防止輸入變成系統命令
  rule_version: 2.0.0
  control_type: technical
  origin:
    legacy_id: IN-04
    legacy_title: Command Injection 防護
    legacy_levels: 普/中/高
    legal_equivalence_verified: false
  applicability:
    must_assess_when: 系統可執行外部命令、Shell、Process 或腳本
    may_be_not_applicable_when: 沒有任何應用程式控制的命令執行路徑
    decision_criteria:
    - 功能是否存在
    - 系統處理資料分類
    - 控制實際責任人
    - 適用且已生效要求/合約政策

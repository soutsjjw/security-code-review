    - repository_relative_path
    - line_start
    - line_end
    - git_revision
    external_locator:
    - artifact_id
    - owner
    - evidence_date
    redaction: 不得將個資、完整 Token、API Key、密碼寫入報告
  manual_review: 背景 Job、外部工具是否存在
  remediation_guidance: 避免 Shell 並隔離參數及權限
  risk:
    default_severity: not_preassigned
    factors:
    - 受影響資料敏感度
    - 攻擊可行性與可利用路徑
    - 暴露面
    - 受影響使用者/系統範圍
    - 既有補償控制

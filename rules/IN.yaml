- id: IN-05
  title: 伺服端輸入驗證
  category: IN
  control_objective: 確保伺服端輸入符合約束
  rule_version: 2.0.0
  control_type: technical
  origin:
    legacy_id: IN-05
    legacy_title: 伺服端輸入驗證
    legacy_levels: 中/高
    legal_equivalence_verified: false
  applicability:
    must_assess_when: 系統處理不可信請求、訊息、檔案或 CLI 參數
    may_be_not_applicable_when: 無任何跨信任邊界輸入，需可驗證
    decision_criteria:
    - 功能是否存在
    - 系統處理資料分類
    - 控制實際責任人
    - 適用且已生效要求/合約政策
    level_selection: 由專案 Profile + 核准矩陣決定；不可由框架或 AI 自動推定
    no_evidence: review
  inspection:
    review_scope: cross_file
    review_tier: standard
    search_targets:
    - Endpoint/DTO 伺服端驗證
    - 資料型別/長度/狀態機驗證
    review_instructions:
    - 檢查相關程式碼、設定與呼叫鏈，確認是否有外部或平台控制責任。
    - 記錄觸發條件、正常行為與繞過/失效情境。
    - 將檢查結果與當前 Commit 及證據來源綁定，避免沿用前次專案結論。
    legacy_inspection_hints:
    - 盤點 DTO
    - Validator
    - Model Binder 與業務邊界條件
    verification_method: source_and_test
  assessment:

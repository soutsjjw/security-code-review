    no_evidence: review
  inspection:
    review_scope: cross_file
    review_tier: high
    search_targets:
    - Process/Shell 呼叫點
    - 命令字元與參數資料流
    review_instructions:
    - 檢查相關程式碼、設定與呼叫鏈，確認是否有外部或平台控制責任。

# 來源：臺灣學術網路危機處理中心（TACERT），《網站安全管理指南》2022 年 8 月修訂 V2。
# PDF 頁碼採封面為第 1 頁的實際 PDF 頁碼，並非文件印刷頁碼。
# 本檔是對原 70 項的補充檢核；related_rule_ids 表示相關而非規範等價。
standard_id: TACERT-WEBSITE-V2
version: "V2"
revision_date: "2022-08"
document_title: "網站安全管理指南"
publisher: "臺灣學術網路危機處理中心（TACERT）"
source_site: "https://cert.tanet.edu.tw/prog/index.php"
source_sections:
  R: "第二章：學術網路常見安全缺失（12 項）"
  D: "第四章：網站安全檢測（14 項）"
  P: "第五章：網站安全防護措施（13 項）"
notes:
  - "第二章的 OWASP Top 10 為 2021 版背景風險分類，不得標註成 OWASP Top 10 2025。"
  - "外部主機、網路與制度的檢查不能只靠原始碼判斷；缺少證據須標示待確認，不能視為符合。"
  - "管理員密碼定期更換等指引內容須依適用政策與等效控制判斷，不應不分情境直接宣稱違規。"
  - "同一控制可對照數條原有規則；不得將本補充檢核對照認作法規強制適用或完整等效。"

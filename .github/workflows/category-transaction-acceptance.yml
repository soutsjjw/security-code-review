name: Category evidence transaction acceptance

on:
  pull_request:
    paths:
      - 'scripts/partial_*.py'
      - 'scripts/review_queue.py'
      - 'tests/test_category_transaction_acceptance.py'
      - 'tests/test_partial_*.py'
      - '.github/workflows/category-transaction-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-full-unittest:
    name: Windows complete unittest and transaction recovery
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run all tests on Windows with real .NET SDK
        run: python -m unittest discover -s tests -v
      - name: Validate package
        run: python scripts/validate_package.py

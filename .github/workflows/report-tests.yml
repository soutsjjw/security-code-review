name: Report tests

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate package
        run: python scripts/validate_package.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  windows-runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test Windows P0 baseline fixtures and subprocess decoding
        env:
          PYTHONUTF8: '0'
        run: python -m unittest discover -s tests -p test_quality_baseline.py -v
      - name: Test Windows P1 Roslyn cross-file candidates
        env:
          PYTHONUTF8: '0'
        run: python -m unittest discover -s tests -p test_p1_callchains.py -v
      - name: Test Windows P2 control effectiveness evidence gate
        env:
          PYTHONUTF8: "0"
        run: python -m unittest discover -s tests -p test_control_effectiveness.py -v
      - name: Test Windows P3 review adjudication
        env:
          PYTHONUTF8: '0'
        run: python -m unittest discover -s tests -p test_p3_adjudication.py -v
      - name: Test Windows second-pass adversarial safeguards
        env:
          PYTHONUTF8: "0"
        run: python -m unittest discover -s tests -p test_adversarial_recheck.py -v
      - name: Test Windows evidence integrity and recovery
        env:
          PYTHONUTF8: '0'
        run: python -m unittest discover -s tests -p test_evidence_integrity.py -v
      - name: Test Windows project inventory UTF-8 subprocess output
        run: python -m unittest discover -s tests -p test_scope_projects.py -v
      - name: Test Windows Python runner
        run: python -m unittest discover -s tests -p test_python_runner.py -v
      - name: Check Windows CMD runner
        shell: pwsh
        run: |
          & .\scripts\run-python.cmd --check
          & .\scripts\run-python.cmd .\scripts\validate_package.py

name: Report tests

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate package
        run: python scripts/validate_package.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  windows-runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test Windows Python runner
        run: python -m unittest discover -s tests -p test_python_runner.py -v
      - name: Check Windows CMD runner
        shell: pwsh
        run: |
          & .\scripts\run-python.cmd --check
          & .\scripts\run-python.cmd .\scripts\validate_package.py
